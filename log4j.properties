### set log levels ###
log4j.rootLogger = stdout

###\u8F93\u51FA\u5230\u63A7\u5236\u53F0###
log4j.appender.stdout = org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target = System.out
log4j.appender.stdout.layout = org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern =  %p %c{1}:%L - %m%n

### set log levels ###
log4j.logger.forcharge = ERROR,CHARGE

###\u5355\u72EC\u4FDD\u5B58\u5145\u503C\u4FE1\u606F###
log4j.appender.CHARGE = org.apache.log4j.DailyRollingFileAppender
log4j.appender.CHARGE.File = /data/pokermaster/logs/payment.log
log4j.appender.CHARGE.Append = true
log4j.appender.CHARGE.Threshold =  ERROR
log4j.appender.CHARGE.layout = org.apache.log4j.PatternLayout
log4j.appender.CHARGE.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss}  %m%n

